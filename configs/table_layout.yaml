canonical_size: [1000, 600]
blinds: [1.0, 2.0]
currency: "BRL"
rois:
  # 1. A Área do Pote (Fundo da mesa, perto do dealer)
  # Aumentei a largura para captar potes maiores ou fichas espalhadas.
  - name: "pot"
    polygon: [[350, 40], [650, 40], [650, 140], [350, 140]]

  # 2. As Cartas Comunitárias (Centro da mesa, ligeiramente para cima)
  # Aumentei a largura para garantir que as 5 cartas (do Flop ao River) cabem perfeitamente.
  - name: "board"
    polygon: [[200, 160], [800, 160], [800, 280], [200, 280]]

  # 3. As Suas Apostas (Entre as suas cartas e o board)
  # Expandido nas laterais, pois as fichas apostadas costumam espalhar-se na horizontal.
  - name: "hero_bet_area"
    polygon: [[300, 310], [700, 310], [700, 440], [300, 440]]

  # 4. As Suas Cartas (Base do ecrã, colado ao jogador)
  # Uma caixa mais apertada no centro-fundo, para evitar ler fichas acidentalmente.
  - name: "hero_hole_cards"
    polygon: [[380, 470], [620, 470], [620, 580], [380, 580]]